<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OVERSEAS JOBS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --black:#0d0d0b; --panel:#17170f; --khaki:#a8a06a; --khaki-dim:#6f6a48;
    --off-white:#ece8dd; --line:#2c2b22;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--black); color:var(--off-white);
    font-family:'Oswald',sans-serif; -webkit-font-smoothing:antialiased; }

  header{ padding:22px 18px 14px; border-bottom:2px solid var(--khaki);

  header h1{ margin:0 0 4px; font-family:'Archivo Black',sans-serif; font-size:22px;
    letter-spacing:1px; text-transform:uppercase; }
  header p{ margin:0; font-family:'JetBrains Mono',monospace; font-size:11px;
    letter-spacing:1.5px; text-transform:uppercase; color:var(--khaki); }
  .lang-switch{ display:flex; gap:4px; flex:none; margin-top:2px; }
  .lang-switch button{ border:1px solid var(--khaki-dim); background:transparent; color:var(--khaki-dim);
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; letter-spacing:0.5px;
    padding:5px 9px; border-radius:2px; cursor:pointer; }
  .lang-switch button.active{ background:var(--khaki); border-color:var(--khaki); color:var(--black); }

  /* Main nav tabs */
  .main-nav{ display:flex; border-bottom:1px solid var(--line); }
  .main-nav button{ flex:1; background:none; border:none; padding:13px 6px;
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase;
    color:var(--khaki-dim); cursor:pointer; border-bottom:2px solid transparent; }
  .main-nav button.active{ color:var(--khaki); border-bottom-color:var(--khaki); }

  .screen{ display:none; }
  .screen.active{ display:block; }

  /* Filters bar */
  .filters-bar{ display:flex; align-items:center; justify-content:space-between;
    padding:12px 18px; border-bottom:1px solid var(--line); }
  .filters-bar button{ border:1px solid var(--khaki); background:transparent; color:var(--khaki);
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase;
    padding:8px 14px; border-radius:2px; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .filters-bar .count{ background:var(--khaki); color:var(--black); border-radius:50%;
    width:16px; height:16px; font-size:10px; display:flex; align-items:center; justify-content:center; }
  .filters-bar .result-count{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--khaki-dim); }

  #list{ padding:14px 18px 30px; display:flex; flex-direction:column; gap:10px; }
  .job{ background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--khaki);
    padding:14px 16px; cursor:pointer; }
  .job .row{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .job h3{ margin:0 0 4px; font-size:16px; font-weight:600; text-transform:uppercase; letter-spacing:0.3px; }
  .job .meta{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--khaki-dim); letter-spacing:0.5px; }
  .job .pay{ font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600; color:var(--khaki); white-space:nowrap; }
  .job .tags{ margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; }
  .job .tag{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.5px; text-transform:uppercase;
    border:1px solid var(--khaki-dim); color:var(--khaki); padding:3px 8px; border-radius:2px; }
  .empty-state{ padding:40px 18px; text-align:center; font-family:'JetBrains Mono',monospace;
    font-size:12px; color:var(--khaki-dim); letter-spacing:0.5px; }

  /* Contact / About static screens */
  .static-page{ padding:24px 18px; }
  .static-page h2{ font-family:'Archivo Black',sans-serif; font-size:19px; text-transform:uppercase;
    letter-spacing:0.5px; margin:0 0 14px; }
  .static-page p{ font-size:14px; line-height:1.6; color:var(--off-white); margin:0 0 18px; }
  .static-page a.contact-btn{ display:inline-block; background:var(--khaki); color:var(--black);
    font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600; letter-spacing:1px;
    text-transform:uppercase; padding:13px 20px; border-radius:2px; text-decoration:none; }

  /* Filter sheet */
  .sheet-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.75); display:none;
    align-items:flex-end; z-index:30; }
  .sheet-overlay.open{ display:flex; }
  .sheet{ background:var(--panel); width:100%; border-top:2px solid var(--khaki);
    padding:20px 18px 24px; max-height:82vh; overflow-y:auto; }
  .sheet h3{ margin:0 0 18px; font-family:'Archivo Black',sans-serif; font-size:16px;
    text-transform:uppercase; letter-spacing:0.5px; }
  .filter-group{ margin-bottom:20px; }
  .filter-group .label{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1.5px;
    text-transform:uppercase; color:var(--khaki-dim); margin-bottom:8px; }
  .pill-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill-row button{ border:1px solid var(--khaki-dim); background:transparent; color:var(--khaki);
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.5px; text-transform:uppercase;
    padding:9px 14px; border-radius:2px; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .pill-row button.active{ background:var(--khaki); border-color:var(--khaki); color:var(--black); font-weight:600; }
  .pill-row button svg{ width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.6; }
  .sheet .apply-filters{ width:100%; padding:14px; border:none; background:var(--khaki); color:var(--black);
    font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600; letter-spacing:1px;
    text-transform:uppercase; cursor:pointer; margin-top:6px; }

  /* Detail overlay */
  #detail{ position:fixed; inset:0; background:var(--black); transform:translateX(100%);
    transition:transform .22s ease; overflow-y:auto; z-index:10; }
  #detail.open{ transform:translateX(0); }
  #detail .top{ padding:18px; border-bottom:2px solid var(--khaki); display:flex; align-items:center; gap:12px; }
  #detail .top button{ border:1px solid var(--khaki-dim); background:none; font-size:16px; cursor:pointer;
    color:var(--khaki); padding:4px 10px; font-family:'JetBrains Mono',monospace; }
  #detail .top strong{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:1.5px;
    text-transform:uppercase; color:var(--khaki-dim); }
  #detail .body{ padding:20px 18px 110px; }
  #detail h2{ margin:0 0 8px; font-family:'Archivo Black',sans-serif; font-size:21px;
    text-transform:uppercase; letter-spacing:0.5px; }
  #detail .meta-line{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--khaki-dim);
    margin-bottom:16px; letter-spacing:0.5px; }
  #detail .pay-box{ background:var(--khaki); color:var(--black); padding:10px 14px;
    font-family:'JetBrains Mono',monospace; font-weight:600; display:inline-block; margin-bottom:18px; letter-spacing:0.5px; }
  #detail .desc{ font-size:14px; line-height:1.6; color:var(--off-white); white-space:pre-line; }

  #applyBar{ position:fixed; left:0; right:0; bottom:0; background:var(--black); border-top:2px solid var(--khaki);
    padding:12px 18px; z-index:11; display:flex; gap:8px; }
  #applyBar button{ flex:1; padding:14px 8px; border:none; font-family:'JetBrains Mono',monospace;
    font-size:12px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; cursor:pointer; }
  #applyBtn{ background:var(--khaki); color:var(--black); }
  #cvBtn{ background:transparent; border:1px solid var(--khaki) !important; color:var(--khaki); }

  #applyForm{ position:fixed; inset:0; background:rgba(0,0,0,.75); display:none; align-items:flex-end; z-index:20; }
  #applyForm.open{ display:flex; }
  #applyForm .sheet-inner{ background:var(--panel); width:100%; border-top:2px solid var(--khaki);
    padding:22px 18px 26px; max-height:80vh; overflow-y:auto; }
  #applyForm h3{ margin:0 0 16px; font-family:'Archivo Black',sans-serif; font-size:16px;
    text-transform:uppercase; letter-spacing:0.5px; }
  #applyForm label{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1px;
    text-transform:uppercase; color:var(--khaki-dim); display:block; margin:14px 0 5px; }
  #applyForm input, #applyForm textarea{ width:100%; background:var(--black); border:1px solid var(--line);
    color:var(--off-white); padding:11px; font-size:14px; font-family:'Oswald',sans-serif; resize:vertical; }
  #applyForm input:focus, #applyForm textarea:focus{ outline:none; border-color:var(--khaki); }
  #applyForm .send{ margin-top:20px; width:100%; padding:14px; border:none; background:var(--khaki); color:var(--black);
    font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600; letter-spacing:1px;
    text-transform:uppercase; cursor:pointer; }
</style>
</head>
<body>

<header>
  <div>
    <h1 id="pageTitle">Overseas Jobs</h1>
    <p id="pageSubtitle">Vacancies abroad — updated weekly</p>
  </div>
  <div class="lang-switch" id="langSwitch">

    <button data-lang="ru">RU</button>
    <button data-lang="ro">RO</button>
  </div>
</header>

<div class="main-nav" id="mainNav">
  <button data-tab="jobs">Jobs</button>
  <button data-tab="contact">Contact</button>
  <button data-tab="about">About</button>
</div>

<!-- JOBS SCREEN -->
<div class="screen active" id="screen-jobs">
  <div class="filters-bar">
    <button id="openFilters">

    </button>
    <span class="result-count" id="resultCount"></span>
  </div>
  <div id="list"></div>
</div>

<!-- CONTACT SCREEN -->
<div class="screen" id="screen-contact">
  <div class="static-page">
    <h2 id="contactTitle">Contact</h2>
    <p id="contactBody">Have a question about a vacancy, or want to send your CV directly? Message us anytime.</p>
    <a class="contact-btn" id="contactBtnPage" href="https://t.me/ceostap16" target="_blank">Message @ceostap16</a>
  </div>
</div>

<!-- ABOUT SCREEN -->
<div class="screen" id="screen-about">
  <div class="static-page">
    <h2 id="aboutTitle">About us</h2>
    <p id="aboutBody"></p>
  </div>
</div>

<!-- FILTER SHEET -->
<div class="sheet-overlay" id="filterSheet">
  <div class="sheet">
    <h3 id="filterSheetTitle">Filter jobs</h3>

    <div class="filter-group">
      <div class="label" id="labelCountry">Country</div>
      <div class="pill-row" id="rowCountry"></div>
    </div>

    <div class="filter-group">
      <div class="label" id="labelEmployment">Employment type</div>
      <div class="pill-row" id="rowEmployment"></div>
    </div>

    <div class="filter-group">
      <div class="label" id="labelFormat">Work format</div>
      <div class="pill-row" id="rowFormat"></div>
    </div>

    <div class="filter-group">
      <div class="label" id="labelGoal">Looking for</div>
      <div class="pill-row" id="rowGoal"></div>
    </div>

    <button class="apply-filters" id="applyFiltersBtn">Show results</button>
  </div>
</div>

<!-- JOB DETAIL -->
<div id="detail">
  <div class="top">
    <button id="back">←</button>
    <strong id="detailLabel">Job details</strong>
  </div>
  <div class="body" id="detailBody"></div>
  <div id="applyBar">
    <button id="applyBtn">Apply now</button>
    <button id="cvBtn">Send CV</button>
  </div>
</div>

<div id="applyForm">
  <div class="sheet-inner">
    <h3 id="formTitle">Send application</h3>
    <label id="labelName">Full name</label>
    <input id="fName" type="text">
    <label id="labelContact">Contact (phone or email)</label>
    <input id="fContact" type="text" placeholder="+1 555 000 0000 / you@email.com">
    <label id="labelMessage">Message (optional)</label>
    <textarea id="fMessage" rows="3"></textarea>
    <button class="send" id="fSend">Send application</button>
  </div>
</div>

    title:{ en:'Site Supervisor Trainee', ru:'Стажёр на позицию прораба', ro:'Stagiar supervizor șantier' },
    pay:'£2,400/mo',
    tags:{
      en:['Career growth','Training provided'],
      ru:['Карьерный рост','Обучение предоставляется'],
      ro:['Creștere în carieră','Instruire oferită']
    },
    desc:{
      en:'Entry role on a construction site near Manchester with a clear path to site supervisor within 12-18 months.\n\nDuties: assisting site management, quality checks, coordination with crews.\nContract: 18 months.\nStructured training and mentorship included.',
      ru:'Стартовая позиция на стройке рядом с Манчестером с чётким карьерным путём до прораба за 12-18 месяцев.\n\nОбязанности: помощь в управлении объектом, контроль качества, координация с бригадами.\nКонтракт: 18 месяцев.\nСтруктурированное обучение и наставничество включены.',
      ro:'Post de start pe un șantier lângă Manchester, cu drum clar spre supervizor de șantier în 12-18 luni.\n\nSarcini: sprijin în managementul șantierului, control calitate, coordonare cu echipele.\nContract: 18 luni.\nInstruire structurată și mentorat incluse.'
    }
  }
];

// ---------- elements ----------
const langSwitch = document.getElementById('langSwitch');
const mainNav = document.getElementById('mainNav');
const listEl = document.getElementById('list');
const detailEl = document.getElementById('detail');
const detailBody = document.getElementById('detailBody');
const applyForm = document.getElementById('applyForm');
const filterSheet = document.getElementById('filterSheet');

// ---------- language ----------
function setLang(newLang){
  lang = newLang;
  const t = UI[lang];

  document.getElementById('pageTitle').textContent = t.title;
  document.getElementById('pageSubtitle').textContent = t.subtitle;

  mainNav.querySelector('[data-tab="jobs"]').textContent = t.tabJobs;
  mainNav.querySelector('[data-tab="contact"]').textContent = t.tabContact;
  mainNav.querySelector('[data-tab="about"]').textContent = t.tabAbout;

  document.getElementById('filtersLabel').textContent = t.filters;
  document.getElementById('filterSheetTitle').textContent = t.filterSheetTitle;
  document.getElementById('labelCountry').textContent = t.labelCountry;
  document.getElementById('labelEmployment').textContent = t.labelEmployment;
  document.getElementById('labelFormat').textContent = t.labelFormat;
  document.getElementById('labelGoal').textContent = t.labelGoal;
  document.getElementById('applyFiltersBtn').textContent = t.showResults;

  document.getElementById('detailLabel').textContent = t.jobDetails;
  document.getElementById('applyBtn').textContent = t.applyNow;
  document.getElementById('cvBtn').textContent = t.sendCv;
  document.getElementById('formTitle').textContent = t.sendApplication;
  document.getElementById('labelName').textContent = t.fullName;
  document.getElementById('labelContact').textContent = t.contact;
  document.getElementById('labelMessage').textContent = t.message;
  document.getElementById('fSend').textContent = t.sendApplication;

  document.getElementById('contactTitle').textContent = t.contactTitle;
  document.getElementById('contactBody').textContent = t.contactBody;
  document.getElementById('contactBtnPage').textContent = t.contactBtn;

  document.getElementById('aboutTitle').textContent = t.aboutTitle;
  document.getElementById('aboutBody').textContent = t.aboutBody;

  langSwitch.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));

  renderFilterSheet();
  renderList();
  if (currentJob) openDetail(currentJob);
}

langSwitch.querySelectorAll('button').forEach(b => b.onclick = () => setLang(b.dataset.lang));

// ---------- tabs ----------
mainNav.querySelectorAll('button').forEach(b => {
  b.onclick = () => {
    activeTab = b.dataset.tab;
    mainNav.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + activeTab).classList.add('active');
  };
});
mainNav.querySelector('[data-tab="jobs"]').classList.add('active');

// ---------- filter sheet ----------
function pillRow(containerId, options, filterKey){
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  options.forEach(opt => {
    const b = document.createElement('button');
    b.innerHTML = (opt.icon ? ICONS[opt.icon] : '') + '<span>' + opt.label + '</span>';
    if (filters[filterKey] === opt.value) b.classList.add('active');
    b.onclick = () => { filters[filterKey] = opt.value; renderFilterSheet(); };
    el.appendChild(b);
  });
}

function renderFilterSheet(){
  const t = UI[lang];
  pillRow('rowCountry', [
    { value:'all', label:t.optAll }, { value:'UK', label:t.optUK }, { value:'DE', label:t.optGermany }
  ], 'country');
  pillRow('rowEmployment', [
    { value:'all', label:t.optAll }, { value:'full', label:t.optFullTime }, { value:'part', label:t.optPartTime }
  ], 'employment');
  pillRow('rowFormat', [
    { value:'all', label:t.optAll }, { value:'remote', label:t.optRemote, icon:'remote' }, { value:'onsite', label:t.optOnsite, icon:'onsite' }
  ], 'format');
  pillRow('rowGoal', [
    { value:'any', label:t.optAnyJob }, { value:'career', label:t.optCareerGrowth }
  ], 'goal');

  const count = (filters.country!=='all'?1:0) + (filters.employment!=='all'?1:0) +
                (filters.format!=='all'?1:0) + (filters.goal!=='any'?1:0);
  const badge = document.getElementById('filterCount');
  badge.style.display = count > 0 ? 'flex' : 'none';
  badge.textContent = count;
}

document.getElementById('openFilters').onclick = () => filterSheet.classList.add('open');
document.getElementById('applyFiltersBtn').onclick = () => {
  filterSheet.classList.remove('open');
  renderList();
};
filterSheet.onclick = (e) => { if (e.target === filterSheet) filterSheet.classList.remove('open'); };

// ---------- job list ----------
function matchesFilters(j){
  if (filters.country !== 'all' && j.countryCode !== filters.country) return false;
  if (filters.employment !== 'all' && j.employment !== filters.employment) return false;
  if (filters.format !== 'all' && j.format !== filters.format) return false;
  if (filters.goal !== 'any' && j.goal !== filters.goal) return false;
  return true;
}

function renderList(){
  const t = UI[lang];
  const jobs = JOBS.filter(matchesFilters);
  document.getElementById('resultCount').textContent = t.resultsFound(jobs.length);

  listEl.innerHTML = '';
  if (jobs.length === 0){
    listEl.innerHTML = `<div class="empty-state">${t.noResults}</div>`;
    return;
  }
  jobs.forEach(j => {
    const el = document.createElement('div');
    el.className = 'job';
    const empLabel = j.employment === 'full' ? t.optFullTime : t.optPartTime;
    el.innerHTML = `
      <div class="row">
        <div>
          <h3>${j.title[lang]}</h3>
          <div class="meta">${j.country[lang]} · ${empLabel}</div>
        </div>
        <div class="pay">${j.pay}</div>
      </div>
      <div class="tags">${j.tags[lang].map(tag => `<span class="tag">${tag}</span>`).join('')}</div>
    `;
    el.onclick = () => openDetail(j);
    listEl.appendChild(el);
  });
}

// ---------- job detail ----------
function openDetail(job){
  currentJob = job;
  const t = UI[lang];
  const empLabel = job.employment === 'full' ? t.optFullTime : t.optPartTime;
  detailBody.innerHTML = `
    <h2>${job.title[lang]}</h2>
    <div class="meta-line">${job.country[lang]} · ${empLabel}</div>
    <div class="pay-box">${job.pay}</div>
    <div class="desc">${job.desc[lang]}</div>
  `;
  detailEl.classList.add('open');
}

document.getElementById('back').onclick = () => detailEl.classList.remove('open');
document.getElementById('applyBtn').onclick = () => applyForm.classList.add('open');

document.getElementById('cvBtn').onclick = () => {
  const text = encodeURIComponent('CV / ' + (currentJob ? currentJob.title.en : 'general'));
  const url = 'https://t.me/' + CONTACT_USERNAME + '?text=' + text;
  if (tg) tg.openTelegramLink(url); else window.open(url, '_blank');
};

document.getElementById('contactBtnPage').addEventListener('click', (e) => {
  if (tg) { e.preventDefault(); tg.openTelegramLink('https://t.me/' + CONTACT_USERNAME); }
});

document.getElementById('fSend').onclick = () => {
  const name = document.getElementById('fName').value.trim();
  const contact = document.getElementById('fContact').value.trim();
  const message = document.getElementById('fMessage').value.trim();
  const t = UI[lang];

  if (!name || !contact) { alert(t.fillRequired); return; }

  const payload = JSON.stringify({
    type:'application', jobId: currentJob.id, jobTitle: currentJob.title.en, lang, name, contact, message
  });

  if (tg) tg.sendData(payload);
  else alert(t.demoAlert + payload);

  applyForm.classList.remove('open');
};

// ---------- init ----------
setLang('en');
</script>

</body>
</html>
