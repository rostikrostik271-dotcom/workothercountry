<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OVERSEAS JOBS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #0d0d0b;
    --panel: #17170f;
    --khaki: #a8a06a;
    --khaki-dim: #6f6a48;
    --off-white: #ece8dd;
    --line: #2c2b22;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--black);
    color: var(--off-white);
    font-family: 'Oswald', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header{
    padding: 22px 18px 18px;
    border-bottom: 2px solid var(--khaki);
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap: 12px;
  }
  header h1{
    margin:0 0 4px;
    font-family: 'Archivo Black', sans-serif;
    font-size: 24px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--off-white);
  }
  header p{
    margin:0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--khaki);
  }
  .lang-switch{
    display:flex;
    gap:4px;
    flex: none;
    margin-top: 2px;
  }
  .lang-switch button{
    border: 1px solid var(--khaki-dim);
    background: transparent;
    color: var(--khaki-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 5px 9px;
    border-radius: 2px;
    cursor:pointer;
  }
  .lang-switch button.active{
    background: var(--khaki);
    border-color: var(--khaki);
    color: var(--black);
  }
  .filters{
    display:flex;
    gap:8px;
    padding: 14px 18px;
    overflow-x:auto;
    border-bottom: 1px solid var(--line);
  }
  .filters button{
    flex: none;
    border: 1px solid var(--khaki-dim);
    background: transparent;
    color: var(--khaki);
    padding: 7px 14px;
    border-radius: 2px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor:pointer;
  }
  .filters button.active{
    background: var(--khaki);
    border-color: var(--khaki);
    color: var(--black);
    font-weight: 600;
  }
  #list{ padding: 16px 18px 100px; display:flex; flex-direction:column; gap:10px; }
  .job{
    background: var(--panel);
    border:1px solid var(--line);
    border-left: 3px solid var(--khaki);
    padding: 14px 16px;
    cursor:pointer;
  }
  .job .row{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .job h3{
    margin:0 0 4px;
    font-size:16px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .job .meta{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--khaki-dim);
    letter-spacing: 0.5px;
  }
  .job .pay{
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--khaki);
    white-space: nowrap;
  }
  .job .tags{ margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; }
  .job .tag{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    border: 1px solid var(--khaki-dim);
    color: var(--khaki);
    padding: 3px 8px;
    border-radius: 2px;
  }

  /* Detail overlay */
  #detail{
    position:fixed; inset:0;
    background: var(--black);
    transform: translateX(100%);
    transition: transform .22s ease;
    overflow-y:auto;
    z-index: 10;
  }
  #detail.open{ transform: translateX(0); }
  #detail .top{
    padding: 18px;
    border-bottom:2px solid var(--khaki);
    display:flex; align-items:center; gap:12px;
  }
  #detail .top button{
    border: 1px solid var(--khaki-dim);
    background:none;
    font-size:16px;
    cursor:pointer;
    color: var(--khaki);
    padding: 4px 10px;
    font-family: 'JetBrains Mono', monospace;
  }
  #detail .top strong{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--khaki-dim);
  }
  #detail .body{ padding: 20px 18px; }
  #detail h2{
    margin:0 0 8px;
    font-family: 'Archivo Black', sans-serif;
    font-size: 21px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  #detail .meta-line{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--khaki-dim);
    margin-bottom:16px;
    letter-spacing: 0.5px;
  }
  #detail .pay-box{
    background: var(--khaki);
    color: var(--black);
    padding: 10px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-weight:600;
    display:inline-block;
    margin-bottom:18px;
    letter-spacing: 0.5px;
  }
  #detail .desc{ font-size:14px; line-height:1.6; color: var(--off-white); white-space:pre-line; }

  /* Apply form */
  #applyBar{
    position:fixed; left:0; right:0; bottom:0;
    background: var(--black); border-top:2px solid var(--khaki);
    padding: 12px 18px; z-index: 11;
  }
  #applyBar button{
    width:100%; padding: 14px; border: none;
    background: var(--khaki); color: var(--black);
    font-family: 'JetBrains Mono', monospace;
    font-size:13px; font-weight:600; letter-spacing: 1px; text-transform: uppercase;
    cursor:pointer;
  }
  #applyForm{
    position:fixed; inset:0; background: rgba(0,0,0,.75);
    display:none; align-items:flex-end; z-index:20;
  }
  #applyForm.open{ display:flex; }
  #applyForm .sheet{
    background: var(--panel); width:100%; border-top: 2px solid var(--khaki);
    padding: 22px 18px 26px; max-height: 80vh; overflow-y:auto;
  }
  #applyForm h3{
    margin:0 0 16px; font-family: 'Archivo Black', sans-serif;
    font-size:16px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  #applyForm label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--khaki-dim); display:block; margin: 14px 0 5px;
  }
  #applyForm input, #applyForm textarea{
    width:100%; background: var(--black); border:1px solid var(--line); color: var(--off-white);
    padding:11px; font-size:14px; font-family: 'Oswald', sans-serif; resize:vertical;
  }
  #applyForm input:focus, #applyForm textarea:focus{ outline:none; border-color: var(--khaki); }
  #applyForm .send{
    margin-top:20px; width:100%; padding:14px; border: none;
    background: var(--khaki); color: var(--black);
    font-family: 'JetBrains Mono', monospace;
    font-size:13px; font-weight:600; letter-spacing: 1px; text-transform: uppercase;
    cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1 id="pageTitle">Overseas Jobs</h1>
    <p id="pageSubtitle">Vacancies abroad — updated weekly</p>
  </div>
  <div class="lang-switch" id="langSwitch">
    <button data-lang="en">EN</button>
    <button data-lang="ru">RU</button>
    <button data-lang="ro">RO</button>
  </div>
</header>

<div class="filters" id="filters"></div>
<div id="list"></div>

<div id="detail">
  <div class="top">
    <button id="back">←</button>
    <strong id="detailLabel">Job details</strong>
  </div>
  <div class="body" id="detailBody"></div>
  <div id="applyBar"><button id="applyBtn">Apply now</button></div>
</div>

<div id="applyForm">
  <div class="sheet">
    <h3 id="formTitle">Send application</h3>
    <label id="labelName">Full name</label>
    <input id="fName" type="text">
    <label id="labelContact">Contact (phone or email)</label>
    <input id="fContact" type="text" placeholder="+1 555 000 0000 / you@email.com">
    <label id="labelMessage">Message (optional)</label>
    <textarea id="fMessage" rows="3"></textarea>
    <button class="send" id="fSend">Send application</button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

let lang = 'en';

const UI = {
  en: {
    title: 'Overseas Jobs', subtitle: 'Vacancies abroad — updated weekly',
    all: 'All', jobDetails: 'Job details', applyNow: 'Apply now',
    sendApplication: 'Send application', fullName: 'Full name',
    contact: 'Contact (phone or email)', message: 'Message (optional)',
    fillRequired: 'Please fill in your name and contact.',
    demoAlert: 'Application (demo, outside Telegram):\n', thanks: 'Thanks! Application sent'
  },
  ru: {
    title: 'Работа за рубежом', subtitle: 'Вакансии за границей — обновляется еженедельно',
    all: 'Все', jobDetails: 'О вакансии', applyNow: 'Откликнуться',
    sendApplication: 'Отправить отклик', fullName: 'Полное имя',
    contact: 'Контакт (телефон или email)', message: 'Сообщение (необязательно)',
    fillRequired: 'Заполните имя и контакт.',
    demoAlert: 'Отклик (демо, вне Telegram):\n', thanks: 'Спасибо! Отклик отправлен'
  },
  ro: {
    title: 'Locuri de muncă peste hotare', subtitle: 'Oferte actualizate săptămânal',
    all: 'Toate', jobDetails: 'Detalii job', applyNow: 'Aplică acum',
    sendApplication: 'Trimite aplicația', fullName: 'Nume complet',
    contact: 'Contact (telefon sau email)', message: 'Mesaj (opțional)',
    fillRequired: 'Completează numele și contactul.',
    demoAlert: 'Aplicație (demo, în afara Telegram):\n', thanks: 'Mulțumim! Aplicația a fost trimisă'
  }
};

const CATEGORY_LABELS = {
  Logistics: { en:'Logistics', ru:'Логистика', ro:'Logistică' },
  Hospitality: { en:'Hospitality', ru:'Гостиничное дело', ro:'Ospitalitate' },
  Manufacturing: { en:'Manufacturing', ru:'Производство', ro:'Producție' },
};

// Replace with your real vacancies. Fill "en/ru/ro" for each field you want translated.
const JOBS = [
  {
    id:'j1', category:'Logistics',
    country:{ en:'Germany', ru:'Германия', ro:'Germania' },
    title:{ en:'Warehouse Operative', ru:'Работник склада', ro:'Operator depozit' },
    pay:'€2,100/mo',
    tags:{
      en:['Accommodation provided','No experience needed'],
      ru:['Жильё предоставляется','Опыт не обязателен'],
      ro:['Cazare inclusă','Fără experiență necesară']
    },
    desc:{
      en:'Full-time warehouse role in a logistics hub near Berlin.\n\nDuties: picking, packing, loading.\nContract: 6 months, extendable.\nAccommodation and transport to work included.',
      ru:'Работа на складе полный день, логистический центр рядом с Берлином.\n\nОбязанности: комплектация, упаковка, погрузка.\nКонтракт: 6 месяцев с продлением.\nЖильё и транспорт до работы включены.',
      ro:'Post cu normă întreagă într-un hub logistic lângă Berlin.\n\nSarcini: preluare, ambalare, încărcare.\nContract: 6 luni, prelungibil.\nCazare și transport la muncă incluse.'
    }
  },
  {
    id:'j2', category:'Hospitality',
    country:{ en:'Malta', ru:'Мальта', ro:'Malta' },
    title:{ en:'Hotel Housekeeper', ru:'Горничная в отеле', ro:'Cameristă hotel' },
    pay:'€1,650/mo',
    tags:{
      en:['Seasonal','Meals included'],
      ru:['Сезонная работа','Питание включено'],
      ro:['Sezonier','Masă inclusă']
    },
    desc:{
      en:'Seasonal housekeeping position at a beachfront hotel.\n\nDuties: room cleaning, laundry support.\nContract: April–October.\nMeals and staff housing included.',
      ru:'Сезонная работа горничной в отеле на берегу моря.\n\nОбязанности: уборка номеров, помощь с прачечной.\nКонтракт: апрель–октябрь.\nПитание и жильё для персонала включены.',
      ro:'Post sezonier de cameristă într-un hotel de pe litoral.\n\nSarcini: curățenie camere, sprijin la spălătorie.\nContract: aprilie–octombrie.\nMasă și cazare pentru personal incluse.'
    }
  },
  {
    id:'j3', category:'Manufacturing',
    country:{ en:'Poland', ru:'Польша', ro:'Polonia' },
    title:{ en:'CNC Machine Operator', ru:'Оператор ЧПУ', ro:'Operator CNC' },
    pay:'€1,900/mo',
    tags:{
      en:['Training provided'],
      ru:['Обучение предоставляется'],
      ro:['Instruire oferită']
    },
    desc:{
      en:'Factory role operating CNC milling machines.\n\nDuties: machine setup, quality checks.\nContract: 12 months.\nOn-site training provided in the first two weeks.',
      ru:'Работа на заводе с фрезерными станками с ЧПУ.\n\nОбязанности: настройка станка, контроль качества.\nКонтракт: 12 месяцев.\nОбучение на месте в первые две недели.',
      ro:'Post în fabrică pentru operarea mașinilor CNC de frezat.\n\nSarcini: configurare mașină, control calitate.\nContract: 12 luni.\nInstruire la fața locului în primele două săptămâni.'
    }
  }
];

let activeCategory = 'All';
let currentJob = null;

const langSwitch = document.getElementById('langSwitch');
const filtersEl = document.getElementById('filters');
const listEl = document.getElementById('list');
const detailEl = document.getElementById('detail');
const detailBody = document.getElementById('detailBody');
const applyForm = document.getElementById('applyForm');

function setLang(newLang){
  lang = newLang;
  const t = UI[lang];
  document.getElementById('pageTitle').textContent = t.title;
  document.getElementById('pageSubtitle').textContent = t.subtitle;
  document.getElementById('detailLabel').textContent = t.jobDetails;
  document.getElementById('applyBtn').textContent = t.applyNow;
  document.getElementById('formTitle').textContent = t.sendApplication;
  document.getElementById('labelName').textContent = t.fullName;
  document.getElementById('labelContact').textContent = t.contact;
  document.getElementById('labelMessage').textContent = t.message;
  document.getElementById('fSend').textContent = t.sendApplication;

  langSwitch.querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });

  renderFilters();
  renderList();
  if (currentJob) openDetail(currentJob);
}

langSwitch.querySelectorAll('button').forEach(b => {
  b.onclick = () => setLang(b.dataset.lang);
});

function renderFilters(){
  const cats = ['All', ...new Set(JOBS.map(j => j.category))];
  filtersEl.innerHTML = '';
  cats.forEach(cat => {
    const b = document.createElement('button');
    b.textContent = cat === 'All' ? UI[lang].all : CATEGORY_LABELS[cat][lang];
    if (cat === activeCategory) b.classList.add('active');
    b.onclick = () => { activeCategory = cat; renderFilters(); renderList(); };
    filtersEl.appendChild(b);
  });
}

function renderList(){
  listEl.innerHTML = '';
  const jobs = activeCategory === 'All' ? JOBS : JOBS.filter(j => j.category === activeCategory);
  jobs.forEach(j => {
    const el = document.createElement('div');
    el.className = 'job';
    el.innerHTML = `
      <div class="row">
        <div>
          <h3>${j.title[lang]}</h3>
          <div class="meta">${j.country[lang]} · ${CATEGORY_LABELS[j.category][lang]}</div>
        </div>
        <div class="pay">${j.pay}</div>
      </div>
      <div class="tags">${j.tags[lang].map(t => `<span class="tag">${t}</span>`).join('')}</div>
    `;
    el.onclick = () => openDetail(j);
    listEl.appendChild(el);
  });
}

function openDetail(job){
  currentJob = job;
  detailBody.innerHTML = `
    <h2>${job.title[lang]}</h2>
    <div class="meta-line">${job.country[lang]} · ${CATEGORY_LABELS[job.category][lang]}</div>
    <div class="pay-box">${job.pay}</div>
    <div class="desc">${job.desc[lang]}</div>
  `;
  detailEl.classList.add('open');
}

document.getElementById('back').onclick = () => detailEl.classList.remove('open');
document.getElementById('applyBtn').onclick = () => applyForm.classList.add('open');

document.getElementById('fSend').onclick = () => {
  const name = document.getElementById('fName').value.trim();
  const contact = document.getElementById('fContact').value.trim();
  const message = document.getElementById('fMessage').value.trim();

  if (!name || !contact) {
    alert(UI[lang].fillRequired);
    return;
  }

  const payload = JSON.stringify({
    type: 'application',
    jobId: currentJob.id,
    jobTitle: currentJob.title.en,
    lang, name, contact, message
  });

  if (tg) {
    tg.sendData(payload);
  } else {
    alert(UI[lang].demoAlert + payload);
  }
  applyForm.classList.remove('open');
};

setLang('en');
</script>

</body>
</html>
