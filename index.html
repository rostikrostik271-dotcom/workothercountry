<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OVERSEAS JOBS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #0d0d0b;
    --panel: #17170f;
    --khaki: #a8a06a;
    --khaki-dim: #6f6a48;
    --off-white: #ece8dd;
    --line: #2c2b22;
    --danger: #c4553f;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--black);
    color: var(--off-white);
    font-family: 'Oswald', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header{
    padding: 26px 18px 18px;
    border-bottom: 2px solid var(--khaki);
  }
  header h1{
    margin:0 0 4px;
    font-family: 'Archivo Black', sans-serif;
    font-size: 26px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--off-white);
  }
  header p{
    margin:0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--khaki);
  }
  .filters{
    display:flex;
    gap:8px;
    padding: 14px 18px;
    overflow-x:auto;
    border-bottom: 1px solid var(--line);
  }
  .filters button{
    flex: none;
    border: 1px solid var(--khaki-dim);
    background: transparent;
    color: var(--khaki);
    padding: 7px 14px;
    border-radius: 2px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor:pointer;
  }
  .filters button.active{
    background: var(--khaki);
    border-color: var(--khaki);
    color: var(--black);
    font-weight: 600;
  }
  #list{ padding: 16px 18px 100px; display:flex; flex-direction:column; gap:10px; }
  .job{
    background: var(--panel);
    border:1px solid var(--line);
    border-left: 3px solid var(--khaki);
    padding: 14px 16px;
    cursor:pointer;
  }
  .job .row{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .job h3{
    margin:0 0 4px;
    font-size:16px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .job .meta{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--khaki-dim);
    letter-spacing: 0.5px;
  }
  .job .pay{
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--khaki);
    white-space: nowrap;
  }
  .job .tags{ margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; }
  .job .tag{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    border: 1px solid var(--khaki-dim);
    color: var(--khaki);
    padding: 3px 8px;
    border-radius: 2px;
  }

  /* Detail overlay */
  #detail{
    position:fixed; inset:0;
    background: var(--black);
    transform: translateX(100%);
    transition: transform .22s ease;
    overflow-y:auto;
    z-index: 10;
  }
  #detail.open{ transform: translateX(0); }
  #detail .top{
    padding: 18px;
    border-bottom:2px solid var(--khaki);
    display:flex; align-items:center; gap:12px;
  }
  #detail .top button{
    border: 1px solid var(--khaki-dim);
    background:none;
    font-size:16px;
    cursor:pointer;
    color: var(--khaki);
    padding: 4px 10px;
    font-family: 'JetBrains Mono', monospace;
  }
  #detail .top strong{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--khaki-dim);
  }
  #detail .body{ padding: 20px 18px; }
  #detail h2{
    margin:0 0 8px;
    font-family: 'Archivo Black', sans-serif;
    font-size: 21px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  #detail .meta-line{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--khaki-dim);
    margin-bottom:16px;
    letter-spacing: 0.5px;
  }
  #detail .pay-box{
    background: var(--khaki);
    color: var(--black);
    padding: 10px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-weight:600;
    display:inline-block;
    margin-bottom:18px;
    letter-spacing: 0.5px;
  }
  #detail .desc{ font-size:14px; line-height:1.6; color: var(--off-white); white-space:pre-line; }

  /* Apply form */
  #applyBar{
    position:fixed; left:0; right:0; bottom:0;
    background: var(--black); border-top:2px solid var(--khaki);
    padding: 12px 18px; z-index: 11;
  }
  #applyBar button{
    width:100%; padding: 14px; border: none;
    background: var(--khaki); color: var(--black);
    font-family: 'JetBrains Mono', monospace;
    font-size:13px; font-weight:600; letter-spacing: 1px; text-transform: uppercase;
    cursor:pointer;
  }
  #applyForm{
    position:fixed; inset:0; background: rgba(0,0,0,.75);
    display:none; align-items:flex-end; z-index:20;
  }
  #applyForm.open{ display:flex; }
  #applyForm .sheet{
    background: var(--panel); width:100%; border-top: 2px solid var(--khaki);
    padding: 22px 18px 26px; max-height: 80vh; overflow-y:auto;
  }
  #applyForm h3{
    margin:0 0 16px; font-family: 'Archivo Black', sans-serif;
    font-size:16px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  #applyForm label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--khaki-dim); display:block; margin: 14px 0 5px;
  }
  #applyForm input, #applyForm textarea{
    width:100%; background: var(--black); border:1px solid var(--line); color: var(--off-white);
    padding:11px; font-size:14px; font-family: 'Oswald', sans-serif; resize:vertical;
  }
  #applyForm input:focus, #applyForm textarea:focus{ outline:none; border-color: var(--khaki); }
  #applyForm .send{
    margin-top:20px; width:100%; padding:14px; border: none;
    background: var(--khaki); color: var(--black);
    font-family: 'JetBrains Mono', monospace;
    font-size:13px; font-weight:600; letter-spacing: 1px; text-transform: uppercase;
    cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <h1>Overseas Jobs</h1>
  <p>Vacancies abroad — updated weekly</p>
</header>

<div class="filters" id="filters"></div>
<div id="list"></div>

<div id="detail">
  <div class="top">
    <button id="back">←</button>
    <strong>Job details</strong>
  </div>
  <div class="body" id="detailBody"></div>
  <div id="applyBar"><button id="applyBtn">Apply now</button></div>
</div>

<div id="applyForm">
  <div class="sheet">
    <h3>Send application</h3>
    <label>Full name</label>
    <input id="fName" type="text" placeholder="Your name">
    <label>Contact (phone or email)</label>
    <input id="fContact" type="text" placeholder="+1 555 000 0000 or you@email.com">
    <label>Message (optional)</label>
    <textarea id="fMessage" rows="3" placeholder="Anything you'd like us to know"></textarea>
    <button class="send" id="fSend">Send application</button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// Replace with your real vacancies
const JOBS = [
  { id:'j1', title:'Warehouse Operative', country:'Germany', category:'Logistics',
    pay:'€2,100/mo', tags:['Accommodation provided','No experience needed'],
    desc:'Full-time warehouse role in a logistics hub near Berlin.\n\nDuties: picking, packing, loading.\nContract: 6 months, extendable.\nAccommodation and transport to work included.' },
  { id:'j2', title:'Hotel Housekeeper', country:'Malta', category:'Hospitality',
    pay:'€1,650/mo', tags:['Seasonal','Meals included'],
    desc:'Seasonal housekeeping position at a beachfront hotel.\n\nDuties: room cleaning, laundry support.\nContract: April–October.\nMeals and staff housing included.' },
  { id:'j3', title:'CNC Machine Operator', country:'Poland', category:'Manufacturing',
    pay:'€1,900/mo', tags:['Training provided'],
    desc:'Factory role operating CNC milling machines.\n\nDuties: machine setup, quality checks.\nContract: 12 months.\nOn-site training provided in the first two weeks.' },
];

const CATEGORIES = ['All', ...new Set(JOBS.map(j => j.category))];
let activeCategory = 'All';
let currentJob = null;

const filtersEl = document.getElementById('filters');
const listEl = document.getElementById('list');
const detailEl = document.getElementById('detail');
const detailBody = document.getElementById('detailBody');
const applyForm = document.getElementById('applyForm');

function renderFilters(){
  filtersEl.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const b = document.createElement('button');
    b.textContent = cat;
    if (cat === activeCategory) b.classList.add('active');
    b.onclick = () => { activeCategory = cat; renderFilters(); renderList(); };
    filtersEl.appendChild(b);
  });
}

function renderList(){
  listEl.innerHTML = '';
  const jobs = activeCategory === 'All' ? JOBS : JOBS.filter(j => j.category === activeCategory);
  jobs.forEach(j => {
    const el = document.createElement('div');
    el.className = 'job';
    el.innerHTML = `
      <div class="row">
        <div>
          <h3>${j.title}</h3>
          <div class="meta">${j.country} · ${j.category}</div>
        </div>
        <div class="pay">${j.pay}</div>
      </div>
      <div class="tags">${j.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    `;
    el.onclick = () => openDetail(j);
    listEl.appendChild(el);
  });
}

function openDetail(job){
  currentJob = job;
  detailBody.innerHTML = `
    <h2>${job.title}</h2>
    <div class="meta-line">${job.country} · ${job.category}</div>
    <div class="pay-box">${job.pay}</div>
    <div class="desc">${job.desc}</div>
  `;
  detailEl.classList.add('open');
}

document.getElementById('back').onclick = () => detailEl.classList.remove('open');
document.getElementById('applyBtn').onclick = () => applyForm.classList.add('open');

document.getElementById('fSend').onclick = () => {
  const name = document.getElementById('fName').value.trim();
  const contact = document.getElementById('fContact').value.trim();
  const message = document.getElementById('fMessage').value.trim();

  if (!name || !contact) {
    alert('Please fill in your name and contact.');
    return;
  }

  const payload = JSON.stringify({
    type: 'application',
    jobId: currentJob.id,
    jobTitle: currentJob.title,
    name, contact, message
  });

  if (tg) {
    tg.sendData(payload);
  } else {
    alert('Application (demo, outside Telegram):\n' + payload);
  }
  applyForm.classList.remove('open');
};

renderFilters();
renderList();
</script>

</body>
</html>
